<aside class="sidebar d-flex flex-column text-light vh-100"
       [class.sidebar-compact]="isCompact">

  <!-- HEADER -->
  <div class="sidebar-header d-flex justify-content-between align-items-center mb-3">

    <div class="d-flex align-items-center gap-2">
      <a routerLink="/accueil">
      <img src="assets/images/logo.png" class="logo-box">
        </a>
      <div *ngIf="!isCompact" class="logo-text">
        <div class="fw-bold">Manara</div>
        <small class="text-secondary">Menu Admin</small>
      </div>
    </div>

    <button class="btn btn-sm btn-outline-light" (click)="toggleCompact()">
      <i class="bi"
         [ngClass]="isCompact ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
    </button>

  </div>

  <!-- NAV -->
  <nav class="sidebar-nav flex-grow-2 border-top">

    <a routerLink="/admin/dashboard" routerLinkActive="active"
       class="nav-link d-flex align-items-center"
       [routerLinkActiveOptions]="{ exact: true }">
      <i class="bi bi-speedometer2" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Tableau de bord</span>
    </a>

    <a routerLink="/admin/sessions" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-calendar-event" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Sessions</span>
    </a>

    <a routerLink="/admin/activites" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-journal-text" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Activités</span>
    </a>

    <a routerLink="/admin/evenements" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-flag" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Événements</span>
    </a>

    <a routerLink="/admin/users" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-people" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Utilisateurs</span>
    </a>

    <a routerLink="/admin/planning" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-calendar3" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Planning</span>
    </a>

    <a routerLink="/admin/incidents" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-exclamation-triangle" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Incidents</span>
    </a>

    <a routerLink="/admin/parametres" routerLinkActive="active"
       class="nav-link d-flex align-items-center">
      <i class="bi bi-gear" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Paramètres</span>
    </a>

  </nav>

  <!-- FOOTER -->
  <div class="mt-auto pt-3 border-top">
    <button class="btn btn-outline-light w-100 border-0 text-start"
            (click)="logout()">
      <i class="bi bi-box-arrow-right" [class.me-2]="!isCompact"></i>
      <span *ngIf="!isCompact">Déconnexion</span>
    </button>
  </div>

</aside>
