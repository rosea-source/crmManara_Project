<!-- src/app/features/animateur/components/presences/presences.component.html -->
<div class="d-flex">

  <app-sidebar-animateur></app-sidebar-animateur>

  <div class="content flex-grow-1 p-4 p-lg-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-5">
      <div>
        <h2 class="fw-bold mb-1">Mes Sessions</h2>
        <p class="text-muted mb-0">Gérez les présences et la zone enfant</p>
      </div>
      <a routerLink="/animateur/presences/historique"
         class="btn btn-outline-dark rounded-pill">
        <i class="bi bi-clock-history me-2"></i>Historique présences
      </a>
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-dark"></div>
    </div>

    <!-- VIDE -->
    <div *ngIf="!loading && sessions.length === 0"
         class="text-center text-muted py-5">
      <i class="bi bi-calendar-x fs-1"></i>
      <p class="mt-3">Aucune session assignée pour le moment</p>
    </div>

    <!-- LISTE DES SESSIONS -->
    <div class="row g-4" *ngIf="!loading && sessions.length > 0">

      <div class="col-md-6 col-xl-4" *ngFor="let s of sessions">
        <div class="card border-0 shadow-sm rounded-4 h-100 p-4 d-flex flex-column justify-content-between">

          <div>
            <span class="badge rounded-pill mb-2"
                  [ngClass]="getStatutClass(s.statut)">
              {{ s.statut }}
            </span>

            <h5 class="fw-bold mb-1">{{ s.titre }}</h5>
            <p class="text-muted small mb-3">{{ s.lieu }}</p>

            <div class="d-flex flex-column gap-2">
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-calendar3 text-muted"></i>
                <span>{{ s.dateDebut }} → {{ s.dateFin }}</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-clock text-muted"></i>
                <span>{{ s.heureDebut }} - {{ s.heureFin }}</span>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-dark rounded-pill flex-grow-1 btn-sm fw-bold"
                    (click)="goToPresence(s.id)">
              <i class="bi bi-check2-square me-1"></i> Présences
            </button>
            <button class="btn btn-outline-dark rounded-pill flex-grow-1 btn-sm fw-bold"
                    (click)="goToZone(s.id)">
              <i class="bi bi-chat-left-text me-1"></i> Zone Enfant
            </button>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>
