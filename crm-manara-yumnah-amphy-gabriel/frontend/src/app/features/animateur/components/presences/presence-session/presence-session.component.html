<!-- src/app/features/animateur/components/presences/presence-session/presence-session.component.html -->
<div class="d-flex">

  <app-sidebar-animateur></app-sidebar-animateur>

  <div class="content flex-grow-1 p-4 p-lg-5">

    <!-- HEADER -->
    <div class="d-flex align-items-center gap-3 mb-5">
      <a routerLink="/animateur/presences"
         class="btn btn-outline-dark rounded-circle shadow-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div>
        <h2 class="fw-bold mb-0">Prise des présences</h2>
        <p class="text-muted mb-0">Enregistrez les présences de la session</p>
      </div>
    </div>

    <!-- ALERTS -->
    <div *ngIf="successMessage" class="alert alert-success alert-dismissible rounded-4">
      <i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible rounded-4">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ errorMessage }}
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-dark"></div>
    </div>

    <!-- FORMULAIRE PRÉSENCES -->
    <div *ngIf="!loading">

      <div *ngIf="participants.length === 0" class="text-center text-muted py-5">
        <i class="bi bi-people fs-1"></i>
        <p class="mt-3">Aucun participant inscrit à cette session</p>
      </div>

      <form *ngIf="participants.length > 0" (ngSubmit)="submit()">

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">

          <div class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Liste des participants</h5>
            <span class="badge bg-dark rounded-pill">{{ participants.length }} enfants</span>
          </div>

          <table class="table align-middle mb-0">
            <thead class="table-light text-uppercase small">
              <tr>
                <th class="ps-4" style="width:40%">Enfant</th>
                <th class="text-center">Présent</th>
                <th class="text-center">Absent</th>
                <th class="pe-4">Note / Observation</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of participants; let i = index">

                <td class="ps-4 fw-bold">{{ p.nomComplet }}</td>

                <td class="text-center">
                  <input type="radio"
                         [name]="'statut_' + i"
                         value="Présent"
                         [(ngModel)]="p.statut">
                </td>

                <td class="text-center">
                  <input type="radio"
                         [name]="'statut_' + i"
                         value="Absent"
                         [(ngModel)]="p.statut">
                </td>

                <td class="pe-4">
                  <input type="text"
                         [(ngModel)]="p.note"
                         [name]="'note_' + i"
                         class="form-control form-control-sm border-0 bg-light rounded-pill"
                         placeholder="Note...">
                </td>

              </tr>
            </tbody>
          </table>

          <div class="p-4 text-end bg-white border-top">
            <button type="submit" class="btn btn-dark px-5 rounded-pill fw-bold">
              <i class="bi bi-check-all me-2"></i> Valider et enregistrer
            </button>
          </div>

        </div>

      </form>
    </div>

  </div>
</div>
