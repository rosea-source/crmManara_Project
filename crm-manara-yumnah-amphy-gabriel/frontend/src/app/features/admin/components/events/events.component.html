<div class="d-flex">
  <app-sidebar-admin></app-sidebar-admin>

  <div class="content flex-grow-1 p-4 bg-light">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold mb-0">
        Événements
      </h1>
      <button class="btn action-btn fw-bold px-4" (click)="toggleForm()">
        <i class="bi bi-plus-circle me-2"></i>
        {{ showForm ? 'Annuler' : 'Nouvel événement' }}
      </button>
    </div>

    <!-- FORMULAIRE -->
    <div *ngIf="showForm" class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
      <h5 class="fw-bold mb-4">Créer un événement</h5>

      <div class="alert alert-danger py-2 small" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Titre *</label>
          <input type="text" [(ngModel)]="newEvent.title" name="title"
                 class="form-control rounded-3"
                 placeholder="Titre de l'événement" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea [(ngModel)]="newEvent.description" name="description"
                    class="form-control rounded-3" rows="3"
                    placeholder="Description de l'événement"></textarea>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Date *</label>
            <input type="date" [(ngModel)]="newEvent.date" name="date"
                   class="form-control rounded-3" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Image</label>
            <input type="file"
                   (change)="onFileSelected($event)"
                   accept="image/*"
                   class="form-control rounded-3">
            <small class="text-muted">JPG, PNG, WebP acceptés</small>
          </div>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-dark rounded-pill px-5"
                  [disabled]="loading">
            {{ loading ? 'Création...' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>

    <!-- LISTE -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="p-3 bg-white border-bottom">
        <h5 class="fw-bold mb-0">Liste des événements</h5>
      </div>

      <div *ngIf="events.length === 0" class="text-center py-5 text-muted">
        <i class="bi bi-megaphone fs-1"></i>
        <p class="mt-3">Aucun événement pour le moment</p>
      </div>

      <div class="p-4">
        <div class="row g-4">
          <div class="col-md-6 col-lg-4" *ngFor="let e of events">
            <div class="card border-0 shadow-sm h-100 hover-card rounded-4 overflow-hidden">

              <img *ngIf="e.imageUrl" [src]="e.imageUrl"
                   class="card-img-top"
                   style="height: 180px; object-fit: cover;"
                   alt="{{ e.title }}">

              <div *ngIf="!e.imageUrl"
                   class="bg-dark d-flex align-items-center justify-content-center"
                   style="height: 180px;">
                <i class="bi bi-megaphone-fill text-warning fs-1"></i>
              </div>

              <div class="card-body">
                <span class="badge bg-warning text-dark mb-2">
                  <i class="bi bi-calendar-event me-1"></i>{{ e.date }}
                </span>
                <h5 class="fw-bold">{{ e.title }}</h5>
                <p class="text-muted small">{{ e.description }}</p>
              </div>

              <div class="card-footer bg-white border-0 pb-3 px-3">
                <button class="btn btn-outline-danger btn-sm rounded-pill w-100"
                        (click)="onDelete(e.id)">
                  <i class="bi bi-trash me-1"></i>Supprimer
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
