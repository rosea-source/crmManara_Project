<div class="d-flex">
  <app-sidebar-admin></app-sidebar-admin>

  <div class="content flex-grow-1 p-4 bg-light">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold mb-0">Gestion des activités</h1>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

      <!-- HEADER -->
      <div class="p-3 bg-white d-flex justify-content-between align-items-center border-bottom">
        <input type="text"
               [(ngModel)]="search"
               (ngModelChange)="onSearch()"
               class="form-control rounded-pill"
               placeholder="Rechercher une activité..."
               style="width: 250px;">

        <div class="d-flex align-items-center gap-3">
          <span class="badge bg-secondary rounded-pill px-3 py-2">
            {{ activites.length }} activités
          </span>
          <a routerLink="/admin/activites/create" class="btn btn-dark rounded-pill px-4">
            + Ajouter une activité
          </a>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center mb-0">
          <thead class="table-dark">
            <tr>
              <th>Nom</th>
              <th>Description</th>
              <th>Âge min-max</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="filtered.length === 0">
              <td colspan="4" class="text-muted py-4">Aucune activité trouvée</td>
            </tr>
            <tr *ngFor="let a of filtered">
              <td class="fw-semibold">{{ a.titre }}</td>
              <td class="text-muted small">{{ a.description }}</td>
              <td>
                <span class="badge bg-secondary px-3 py-2">
                  {{ a.ageMin }} - {{ a.ageMax }} ans
                </span>
              </td>
              <td>
                <div class="dropdown">
                  <button class="btn btn-sm btn-link text-dark p-0"
                          type="button"
                          data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical fs-5"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <a class="dropdown-item" [routerLink]="['/admin/activites/edit', a.id]">
                        <i class="bi bi-pencil me-2"></i> Modifier
                      </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item text-danger" (click)="onDelete(a.id)">
                        <i class="bi bi-trash me-2"></i> Supprimer
                      </button>
                    </li>
                  </ul>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
