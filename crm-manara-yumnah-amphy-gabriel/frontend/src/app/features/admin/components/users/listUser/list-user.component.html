<!-- src/app/features/admin/components/users/list/list-user.component.html -->
<div class="d-flex">
  <app-sidebar-admin></app-sidebar-admin>

  <div class="content flex-grow-1 p-4 bg-light">

    <h1 class="mb-4 fw-bold">Gestion des utilisateurs</h1>

    <!-- ALERTS -->
    <div *ngIf="successMessage" class="alert alert-success rounded-3 mb-3">
      <i class="bi bi-check-circle me-2"></i>{{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger rounded-3 mb-3">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ errorMessage }}
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

      <!-- TOOLBAR -->
      <div class="p-3 bg-white border-bottom">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">

          <div class="d-flex gap-2 flex-wrap">

            <!-- Recherche -->
            <input type="text"
                   [(ngModel)]="search"
                   (ngModelChange)="onSearch()"
                   class="form-control rounded-pill"
                   placeholder="Rechercher..."
                   style="width: 220px;">

            <!-- Filtre par rôle -->
            <select [(ngModel)]="filtreRole"
                    (ngModelChange)="onFiltreRole()"
                    class="form-select rounded-pill"
                    style="width: 170px;">
              <option value="">Tous les rôles</option>
              <option value="ROLE_ADMIN">Administrateur</option>
              <option value="ROLE_ANIMATEUR">Animateur</option>
              <option value="ROLE_PARENT">Parent</option>
            </select>

          </div>

          <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-secondary rounded-pill px-3">
              {{ filtered.length }} utilisateur(s)
            </span>
            <a routerLink="/admin/users/create" class="btn btn-dark rounded-pill px-4">
              <i class="bi bi-plus me-1"></i> Ajouter
            </a>
          </div>

        </div>
      </div>

      <!-- TABLE -->
      <table class="table table-hover align-middle mb-0 text-center">
        <thead class="table-dark">
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Rôle</th>
            <th></th>
          </tr>
        </thead>
        <tbody>

          <tr *ngIf="filtered.length === 0">
            <td colspan="5" class="text-center text-muted py-4">
              Aucun utilisateur trouvé
            </td>
          </tr>

          <tr *ngFor="let u of filtered">
            <td class="fw-semibold">{{ u.prenom }} {{ u.nom }}</td>
            <td class="text-muted">{{ u.email }}</td>
            <td class="text-muted">{{ u.telephone || '—' }}</td>
            <td>
              <span [class]="'badge px-3 py-2 ' + getRoleBadge(u.role)">
                {{ getRoleLabel(u.role) }}
              </span>
            </td>
            <td>
              <div class="dropdown">
                <button class="btn btn-sm btn-link text-dark p-0"
                        type="button"
                        data-bs-toggle="dropdown">
                  <i class="bi bi-three-dots-vertical fs-5"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <a class="dropdown-item" [routerLink]="['/admin/users', u.id]">
                      <i class="bi bi-person me-2"></i> Profil
                    </a>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <button class="dropdown-item text-danger" (click)="onDelete(u.id)">
                      <i class="bi bi-trash me-2"></i> Supprimer
                    </button>
                  </li>
                </ul>
              </div>
            </td>
          </tr>

        </tbody>
      </table>

    </div>
  </div>
</div>
