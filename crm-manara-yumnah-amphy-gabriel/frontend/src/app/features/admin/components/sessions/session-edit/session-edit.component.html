<div class="d-flex">
  <app-sidebar-admin></app-sidebar-admin>

  <div class="content flex-grow-1 p-4 bg-light">

    <div *ngIf="!session" class="text-center py-5 text-muted">
      <div class="spinner-border text-dark"></div>
    </div>

    <div *ngIf="session">

      <div class="d-flex align-items-center gap-3 mb-4">
        <a [routerLink]="['/admin/sessions', id]"
           class="btn btn-outline-dark rounded-circle" style="width:42px;height:42px;">←</a>
        <h2 class="fw-bold mb-0">Modifier la session</h2>
      </div>

      <!-- SUCCESS -->
      <div *ngIf="success" class="alert alert-success rounded-4 mb-3">
        <i class="bi bi-check-circle me-2"></i>{{ success }}
      </div>

      <!-- ERROR -->
      <div *ngIf="error" class="alert alert-danger rounded-4 mb-3">
        <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <form (ngSubmit)="onSubmit()" #f="ngForm">

              <div class="mb-3">
                <label class="form-label fw-bold">Activité</label>
                <select name="activiteId" [(ngModel)]="session.activiteId"
                        class="form-select bg-light">
                  <option *ngFor="let a of activites" [ngValue]="a.id">{{ a.titre }}</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Animateur</label>
                <select name="animateurId" [(ngModel)]="session.animateurId"
                        class="form-select bg-light">
                  <option *ngFor="let a of animateurs" [ngValue]="a.id">{{ a.nom }}</option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label>Date début</label>
                  <input type="date" name="dateDebut" [(ngModel)]="session.dateDebut"
                         class="form-control bg-light">
                </div>
                <div class="col-md-6 mb-3">
                  <label>Date fin</label>
                  <input type="date" name="dateFin" [(ngModel)]="session.dateFin"
                         class="form-control bg-light">
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label>Heure début</label>
                  <input type="time" name="heureDebut" [(ngModel)]="session.heureDebut"
                         class="form-control bg-light">
                </div>
                <div class="col-md-6 mb-3">
                  <label>Heure fin</label>
                  <input type="time" name="heureFin" [(ngModel)]="session.heureFin"
                         class="form-control bg-light">
                </div>
              </div>

              <div class="row">
                <div class="col-md-8 mb-3">
                  <label>Lieu</label>
                  <input type="text" name="lieu" [(ngModel)]="session.lieu"
                         class="form-control bg-light">
                </div>
                <div class="col-md-4 mb-3">
                  <label>Capacité</label>
                  <input type="number" name="capaciteMax" [(ngModel)]="session.capaciteMax"
                         class="form-control bg-light">
                </div>
              </div>

              <div class="mb-4">
                <label>Statut</label>
                <select name="statut" [(ngModel)]="session.statut"
                        class="form-select bg-light">
                  <option value="Prévue">Prévue</option>
                  <option value="En cours">En cours</option>
                  <option value="Terminée">Terminée</option>
                  <option value="Annulée">Annulée</option>
                </select>
              </div>

              <div class="d-flex gap-3 justify-content-end">
                <a [routerLink]="['/admin/sessions', id]"
                   class="btn btn-outline-secondary rounded-pill px-4">Annuler</a>
                <button type="submit" class="btn btn-dark rounded-pill px-5"
                        [disabled]="loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'Mise à jour...' : 'Mettre à jour' }}
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
