<!-- src/app/features/parent/components/enfants/edit/enfants-edit.component.html -->
<div class="d-flex vh-100 overflow-hidden">

  <!-- SIDEBAR -->
  <app-sidebar-parent></app-sidebar-parent>

  <!-- CONTENT -->
  <div class="content flex-grow-1 p-4 p-lg-5 overflow-auto bg-light">

    <div class="d-flex align-items-center gap-3 mb-5">
      <a routerLink="/parent/children/list" class="btn btn-outline-dark rounded-circle shadow-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="fw-bold mb-0">Modifier le profil</h2>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-lg-5">

          <form (ngSubmit)="onSubmit()">

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label fw-bold small text-secondary">Prénom</label>
                <input type="text"
                       class="form-control bg-light border-0 rounded-3 p-3"
                       [(ngModel)]="enfant.prenom"
                       name="prenom"
                       required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold small text-secondary">Nom</label>
                <input type="text"
                       class="form-control bg-light border-0 rounded-3 p-3"
                       [(ngModel)]="enfant.nom"
                       name="nom"
                       required>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold small text-secondary">Date de naissance</label>
                <input type="date"
                       class="form-control bg-light border-0 rounded-3 p-3"
                       [(ngModel)]="enfant.dateNaissance"
                       name="dateNaissance"
                       required>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold small text-secondary">Allergies</label>
                <textarea class="form-control bg-light border-0 rounded-3 p-3"
                          rows="2"
                          [(ngModel)]="enfant.allergies"
                          name="allergies"></textarea>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold small text-secondary">Notes médicales</label>
                <textarea class="form-control bg-light border-0 rounded-3 p-3"
                          rows="3"
                          [(ngModel)]="enfant.notesMedicales"
                          name="notesMedicales"></textarea>
              </div>

            </div>

            <!-- FEEDBACK -->
            <div *ngIf="errorMsg" class="alert alert-danger mt-3 rounded-3">{{ errorMsg }}</div>
            <div *ngIf="successMsg" class="alert alert-success mt-3 rounded-3">{{ successMsg }}</div>

            <div class="d-flex justify-content-end gap-3 mt-4">
              <a routerLink="/parent/children/list" class="btn btn-outline-secondary rounded-pill">
                Annuler
              </a>
              <button type="submit"
                      class="btn btn-dark rounded-pill px-4"
                      [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Enregistrer
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>
</div>
