<div class="d-flex min-vh-100">
  <app-sidebar-parent></app-sidebar-parent>

  <div class="content flex-grow-1 p-4 p-lg-5 bg-light">

    <div class="mb-4">
      <h1 class="fw-bold mb-1">Activités disponibles</h1>
      <p class="text-muted mb-0">Recherchez rapidement une activité pour votre enfant</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
      <div class="input-group">
        <span class="input-group-text bg-light border-0">
          <i class="bi bi-search"></i>
        </span>
        <input type="text"
               class="form-control border-0 bg-light"
               placeholder="Rechercher une activité..."
               [(ngModel)]="searchTerm"
               (ngModelChange)="onSearch()">
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-dark"></div>
    </div>

    <div *ngIf="!loading" class="row g-4">
      <div class="col-sm-6 col-lg-4" *ngFor="let activite of filtered">
        <div class="card border-0 shadow-sm rounded-4 h-100 p-4 d-flex flex-column justify-content-between">
          <div>
            <div class="mb-3">
              <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-3"
                   style="width:50px;height:50px;">
                <i class="bi bi-grid text-dark fs-4"></i>
              </div>
            </div>
            <h5 class="fw-bold mb-2">{{ activite.titre }}</h5>
            <p class="text-muted small mb-3" style="min-height:60px;">
              {{ activite.description }}
            </p>
          </div>
          <a [routerLink]="['/parent/activities/sessions', activite.id]"
             class="btn btn-dark w-100 rounded-pill">
            Voir les sessions
          </a>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && filtered.length === 0" class="text-center text-muted mt-5">
      <i class="bi bi-search fs-1"></i>
      <p class="mt-3">Aucune activité trouvée</p>
    </div>

  </div>
</div>
